plugins {
    id 'application'
    id 'com.gradleup.shadow' version '9.6.1'
}

group = 'dandelion'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

application {
    mainClass = 'dandelion.Dandelion'
}

tasks.named('shadowJar') {
    archiveClassifier = 'all'
}